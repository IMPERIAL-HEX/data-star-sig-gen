name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Create next patch tag (v0.0.x)
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          if git tag --points-at HEAD | grep -Eq '^v0\.0\.[0-9]+$'; then
            existing_tag="$(git tag --points-at HEAD | grep -E '^v0\.0\.[0-9]+$' | head -n1)"
            echo "tag=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag -l 'v0.0.*' --sort=-v:refname | head -n1 || true)"
          if [ -z "${latest_tag}" ]; then
            next_tag="v0.0.1"
          else
            patch="${latest_tag##*.}"
            next_patch=$((patch + 1))
            next_tag="v0.0.${next_patch}"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git tag -a "${next_tag}" -m "Release ${next_tag}"
          git push origin "${next_tag}"

          echo "tag=${next_tag}" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
